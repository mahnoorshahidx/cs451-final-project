spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trip_budget_planner?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The database team owns the schema, so Hibernate only checks that it matches
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT secret must be 32+ characters. Override with an env var outside local dev.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Secret used to hash bank account numbers for duplicate detection. Override with an env var outside local dev.
app.bank.fingerprint-secret=${BANK_FINGERPRINT_SECRET:change-me-to-another-long-random-string}

# AI recommendations (Claude). Leave ANTHROPIC_API_KEY unset to use the rule-based recommendations.
# Never commit a real key: set it as an environment variable like DB_PASSWORD.
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
app.ai.timeout-seconds=20
app.ai.max-tokens=1024

# Currency conversion. "live" uses Frankfurter (free, no API key needed) and switches to
# fixed demo rates if it can't be reached. Set FX_PROVIDER=fixed to always use the demo rates.
app.fx.provider=${FX_PROVIDER:live}
app.fx.base-url=https://api.frankfurter.dev
app.fx.timeout-seconds=5
app.fx.cache-minutes=60
