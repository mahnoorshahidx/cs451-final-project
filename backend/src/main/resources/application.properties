spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trip_budget_planner?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The database team owns the schema, so Hibernate only checks that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT secret must be 32+ characters. Override with an env var outside local dev.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Secret used to hash bank account numbers for duplicate detection. Override with an env var outside local dev.
app.bank.fingerprint-secret=${BANK_FINGERPRINT_SECRET:change-me-to-another-long-random-string}
